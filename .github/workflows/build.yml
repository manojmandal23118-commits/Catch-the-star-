name: Build Catch The Star Glow Android AAB

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build Signed Android AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install dependencies
        run: |
          set -euo pipefail
          test -f package.json || {
            echo "::error::package.json missing from repository root."
            exit 1
          }
          npm ci

      - name: Build Next.js application
        run: |
          set -euo pipefail
          npm run build

      - name: Prepare Capacitor configuration
        run: |
          set -euo pipefail

          if [ ! -f capacitor.config.ts ] && \
             [ ! -f capacitor.config.json ] && \
             [ ! -f capacitor.config.js ]; then
            echo "::error::Capacitor configuration file not found."
            exit 1
          fi

          npx cap --version

      - name: Add Android platform if missing
        run: |
          set -euo pipefail

          if [ ! -d android ]; then
            npx cap add android
          else
            echo "Android platform already exists."
          fi

          test -d android || {
            echo "::error::Android platform creation failed."
            exit 1
          }

      - name: Sync Capacitor
        run: |
          set -euo pipefail
          npx cap sync android

      - name: Set Android SDK 36
        run: |
          set -euo pipefail

          if [ ! -f android/variables.gradle ]; then
            echo "::warning::android/variables.gradle not found; checking app Gradle configuration."
          fi

          echo "Checking Android Gradle configuration..."
          grep -R -nE 'compileSdk|targetSdk' \
            android/app/build.gradle \
            android/app/build.gradle.kts \
            android/variables.gradle \
            2>/dev/null || true

      - name: Validate Android Gradle project
        run: |
          set -euo pipefail

          test -f android/gradlew || {
            echo "::error::Gradle wrapper missing from android directory."
            exit 1
          }

          chmod +x android/gradlew

          test -f android/app/build.gradle -o \
               -f android/app/build.gradle.kts || {
            echo "::error::Android app Gradle file missing."
            exit 1
          }

      - name: Build Release AAB
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
        run: |
          set -euo pipefail
          cd android
          ./gradlew --no-daemon bundleRelease

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: catch-the-star-glow-release-aab
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 14
