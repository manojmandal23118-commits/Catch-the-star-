name: Catch The Star Glow - Android AAB

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build Signed Android App Bundle
    runs-on: ubuntu-latest

    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Locate and extract game ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE=""

          for file in \
            "catch-the-star-glow-API36-GitHub-AAB.zip" \
            "catch the star glow GitHub AAB.zip" \
            "catch the star glow.zip"
          do
            if [ -f "$file" ]; then
              ZIP_FILE="$file"
              break
            fi
          done

          if [ -z "$ZIP_FILE" ]; then
            ZIP_FILE="$(find . -maxdepth 2 -type f \
              -iname '*catch*star*glow*.zip' \
              -not -path './.git/*' \
              | head -n 1 || true)"
          fi

          if [ -z "$ZIP_FILE" ]; then
            echo "::error::Catch The Star Glow project ZIP was not found."
            echo "Upload the complete game ZIP to the repository root."
            exit 1
          fi

          echo "Selected project ZIP: $ZIP_FILE"

          mkdir -p "$RUNNER_TEMP/catch-star-project"
          unzip -q "$ZIP_FILE" -d "$RUNNER_TEMP/catch-star-project"

          PROJECT_DIR="$RUNNER_TEMP/catch-star-project"

          if [ ! -f "$PROJECT_DIR/package.json" ]; then
            FOUND_PACKAGE="$(find "$PROJECT_DIR" -mindepth 2 \
              -maxdepth 5 -type f -name package.json \
              -not -path '*/node_modules/*' \
              | head -n 1 || true)"

            if [ -z "$FOUND_PACKAGE" ]; then
              echo "::error::package.json was not found in the extracted ZIP."
              exit 1
            fi

            PROJECT_DIR="$(dirname "$FOUND_PACKAGE")"
          fi

          if [ ! -f "$PROJECT_DIR/package.json" ]; then
            echo "::error::Invalid project directory."
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Game project located successfully."

      - name: Check required project files
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          test -f package.json || {
            echo "::error::package.json is missing."
            exit 1
          }

          if [ ! -f package-lock.json ]; then
            echo "::error::package-lock.json is missing. npm ci cannot run."
            exit 1
          fi

          echo "Project files checked."

      - name: Install npm dependencies
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          npm ci

      - name: Check Android and Capacitor configuration
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          node -e "
            const p = require('./package.json');
            const deps = {...p.dependencies, ...p.devDependencies};
            if (!deps['@capacitor/core'] ||
                !deps['@capacitor/android']) {
              console.error('Capacitor Android dependencies are missing.');
              process.exit(1);
            }
          "

          if [ ! -f capacitor.config.ts ] &&
             [ ! -f capacitor.config.json ] &&
             [ ! -f capacitor.config.js ]; then
            echo "::error::Capacitor configuration was not found."
            exit 1
          fi

          echo "Capacitor configuration found."

      - name: Build web application
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          npm run build

      - name: Sync Capacitor Android project
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          npx cap sync android

          if [ ! -f android/gradlew ]; then
            echo "::error::Android Gradle wrapper is missing."
            exit 1
          fi

          if [ ! -f android/app/build.gradle ] &&
             [ ! -f android/app/build.gradle.kts ]; then
            echo "::error::Android app Gradle configuration is missing."
            exit 1
          fi

      - name: Configure Android API 36
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          python3 - <<'PY'
          from pathlib import Path
          import re

          candidates = [
              Path("android/variables.gradle"),
              Path("android/app/build.gradle"),
              Path("android/app/build.gradle.kts"),
          ]

          found = False

          for path in candidates:
              if not path.exists():
                  continue

              text = path.read_text(encoding="utf-8")

              if path.name == "variables.gradle":
                  for key in ("compileSdkVersion", "targetSdkVersion"):
                      pattern = rf"({key}\s*=\s*)\d+"
                      text, count = re.subn(pattern, rf"\g<1>36", text)
                      found = found or count > 0

                  path.write_text(text, encoding="utf-8")

              elif path.name == "build.gradle":
                  if re.search(r"\bcompileSdk\s+\d+", text):
                      text = re.sub(
                          r"\bcompileSdk\s+\d+",
                          "compileSdk 36",
                          text,
                      )
                      found = True

                  if re.search(r"\btargetSdk\s+\d+", text):
                      text = re.sub(
                          r"\btargetSdk\s+\d+",
                          "targetSdk 36",
                          text,
                      )
                      found = True

                  path.write_text(text, encoding="utf-8")

              elif path.name == "build.gradle.kts":
                  if re.search(r"\bcompileSdk\s*=\s*\d+", text):
                      text = re.sub(
                          r"\bcompileSdk\s*=\s*\d+",
                          "compileSdk = 36",
                          text,
                      )
                      found = True

                  if re.search(r"\btargetSdk\s*=\s*\d+", text):
                      text = re.sub(
                          r"\btargetSdk\s*=\s*\d+",
                          "targetSdk = 36",
                          text,
                      )
                      found = True

                  path.write_text(text, encoding="utf-8")

          if not found:
              print(
                  "Warning: API settings were not automatically changed. "
                  "The project may define them in another Gradle file."
              )
          else:
              print("Android SDK settings updated where recognized.")
          PY

      - name: Validate signing secrets and keystore
        shell: bash
        run: |
          set -euo pipefail

          : "${ANDROID_KEYSTORE_BASE64:?GitHub Secret KEYSTORE_BASE64 is missing or empty}"
          : "${ANDROID_KEYSTORE_PASSWORD:?GitHub Secret KEYSTORE_PASSWORD is missing or empty}"
          : "${ANDROID_KEY_ALIAS:?GitHub Secret KEY_ALIAS is missing or empty}"
          : "${ANDROID_KEY_PASSWORD:?GitHub Secret KEY_PASSWORD is missing or empty}"

          KEYSTORE="$RUNNER_TEMP/catch-star-upload.jks"

          printf '%s' "$ANDROID_KEYSTORE_BASE64" |
            base64 --decode > "$KEYSTORE"

          test -s "$KEYSTORE"

          keytool -list \
            -keystore "$KEYSTORE" \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            >/dev/null

          echo "ANDROID_KEYSTORE_FILE=$KEYSTORE" >> "$GITHUB_ENV"

          echo "Keystore validation successful."

      - name: Configure release signing
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          python3 - <<'PY'
          from pathlib import Path
          import re

          gradle = Path("android/app/build.gradle")

          if not gradle.exists():
              gradle = Path("android/app/build.gradle.kts")

          if not gradle.exists():
              raise SystemExit("Android app Gradle file was not found.")

          text = gradle.read_text(encoding="utf-8")

          if gradle.suffix == ".kts":
              raise SystemExit(
                  "Kotlin DSL Gradle detected. "
                  "Automatic Groovy signing configuration was skipped "
                  "to avoid corrupting the project."
              )

          if "signingConfigs {" not in text:
              signing = """
              signingConfigs {
                  release {
                      storeFile file(System.getenv('ANDROID_KEYSTORE_FILE'))
                      storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
                      keyAlias System.getenv('ANDROID_KEY_ALIAS')
                      keyPassword System.getenv('ANDROID_KEY_PASSWORD')
                  }
              }
          """

              text, count = re.subn(
                  r"\bandroid\s*\{",
                  lambda m: m.group(0) + "\n" + signing,
                  text,
                  count=1,
              )

              if count == 0:
                  raise SystemExit("Android Gradle block was not found.")

          if "signingConfig signingConfigs.release" not in text:
              text, count = re.subn(
                  r"(buildTypes\s*\{\s*release\s*\{)",
                  r"\1\n            signingConfig signingConfigs.release",
                  text,
                  count=1,
              )

              if count == 0:
                  raise SystemExit(
                      "Release build type was not found. "
                      "Signing configuration was not safely applied."
                  )

          gradle.write_text(text, encoding="utf-8")
          print("Release signing configuration prepared.")
          PY

      - name: Build Release AAB
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR/android"

          chmod +x gradlew
          ./gradlew --no-daemon bundleRelease

      - name: Verify AAB output
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          AAB="$(find android -type f \
            -path '*/outputs/bundle/release/*.aab' \
            | head -n 1 || true)"

          if [ -z "$AAB" ]; then
            echo "::error::Release AAB was not generated."
            exit 1
          fi

          mkdir -p "$RUNNER_TEMP/catch-star-output"
          cp "$AAB" "$RUNNER_TEMP/catch-star-output/Catch-The-Star-Glow.aab"

          echo "AAB generated successfully."

      - name: Upload signed AAB
        uses: actions/upload-artifact@v4
        with:
          name: Catch-The-Star-Glow-Android-AAB
          path: ${{ runner.temp }}/catch-star-output/Catch-The-Star-Glow.aab
          if-no-files-found: error
          retention-days: 14
