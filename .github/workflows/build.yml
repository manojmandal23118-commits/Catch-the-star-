name: Catch The Star Glow - Android AAB API 36

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Find and Extract Game ZIP
        shell: bash
        run: |
          set -e

          mkdir -p game-source

          ZIP_FILE=$(find . -maxdepth 1 -type f -iname '*.zip' | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: Game ZIP file not found."
            exit 1
          fi

          unzip -q "$ZIP_FILE" -d game-source

          PACKAGE_FILE=$(find game-source \
            -name package.json \
            -not -path '*/node_modules/*' \
            | head -n 1)

          if [ -z "$PACKAGE_FILE" ]; then
            echo "ERROR: package.json not found."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PACKAGE_FILE")

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Project directory: $PROJECT_DIR"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Dependencies
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"

          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Fix Dynamic Route for Static Export
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"

          python3 - <<'PY'
          from pathlib import Path

          route = Path("src/app/editor/[projectId]/page.tsx")

          if not route.exists():
              print("Editor route not found; skipping route patch.")
          else:
              source = route.read_text()

              if "generateStaticParams" not in source:
                  addition = (
                      "export function generateStaticParams() {\n"
                      "  return [];\n"
                      "}\n\n"
                  )

                  route.write_text(addition + source)

              print("Dynamic route checked.")
          PY

      - name: Build Web Game
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"
          npm run build

      - name: Verify Web Export
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"

          if [ ! -f out/index.html ]; then
            echo "ERROR: Static export did not create out/index.html."
            exit 1
          fi

          echo "Web export verified."

      - name: Prepare Capacitor Android
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"

          if [ ! -f capacitor.config.ts ] && \
             [ ! -f capacitor.config.json ] && \
             [ ! -f capacitor.config.js ]; then
            echo "ERROR: Capacitor configuration not found."
            exit 1
          fi

          if [ ! -d android ]; then
            npx cap add android
          fi

          npx cap sync android

      - name: Install Android SDK 36
        shell: bash
        run: |
          set -e

          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -x "$SDKMANAGER" ]; then
            echo "ERROR: Android SDK Manager not found."
            exit 1
          fi

          yes | "$SDKMANAGER" --licenses || true

          "$SDKMANAGER" "platforms;android-36"
          "$SDKMANAGER" "build-tools;36.0.0"

      - name: Configure Android API 36
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR/android"

          python3 - <<'PY'
          from pathlib import Path
          import re

          candidates = [
              Path("app/build.gradle"),
              Path("app/build.gradle.kts"),
          ]

          gradle = next((p for p in candidates if p.exists()), None)

          if gradle is None:
              raise SystemExit("Android app Gradle file not found.")

          source = gradle.read_text()

          if gradle.suffix == ".kts":
              source = re.sub(
                  r'compileSdk\s*=\s*\d+',
                  'compileSdk = 36',
                  source
              )
              source = re.sub(
                  r'targetSdk\s*=\s*\d+',
                  'targetSdk = 36',
                  source
              )
          else:
              source = re.sub(
                  r'compileSdkVersion\s+\d+',
                  'compileSdkVersion 36',
                  source
              )
              source = re.sub(
                  r'compileSdk\s+\d+',
                  'compileSdk 36',
                  source
              )
              source = re.sub(
                  r'targetSdkVersion\s+\d+',
                  'targetSdkVersion 36',
                  source
              )
              source = re.sub(
                  r'targetSdk\s+\d+',
                  'targetSdk 36',
                  source
              )

          gradle.write_text(source)
          print(f"Configured API 36 in {gradle}")
          PY

      - name: Build Release AAB
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR/android"

          chmod +x gradlew

          ./gradlew --no-daemon bundleRelease

      - name: Upload AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: catch-the-star-glow-aab
          path: game-source/**/android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 14
