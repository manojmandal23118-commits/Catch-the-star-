name: Build Catch The Star Glow Android AAB

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build Android App Bundle
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Find and extract project ZIP
        shell: bash
        run: |
          set -euo pipefail

          if [ -f package.json ]; then
            echo "Project already exists in repository root."
          else
            ZIP_FILE="$(find . -maxdepth 3 -type f -iname '*.zip' \
              ! -path './.git/*' | head -n 1)"

            if [ -z "$ZIP_FILE" ]; then
              echo "::error::package.json and project ZIP were not found."
              echo "Upload the complete project ZIP to the repository."
              exit 1
            fi

            echo "Extracting: $ZIP_FILE"
            mkdir -p /tmp/catch-star-project
            unzip -oq "$ZIP_FILE" -d /tmp/catch-star-project

            PACKAGE_FILE="$(find /tmp/catch-star-project \
              -type f -name package.json | head -n 1)"

            if [ -z "$PACKAGE_FILE" ]; then
              echo "::error::No package.json found inside the ZIP."
              exit 1
            fi

            PROJECT_DIR="$(dirname "$PACKAGE_FILE")"
            cp -a "$PROJECT_DIR/." "$GITHUB_WORKSPACE/"
          fi

          test -f package.json || {
            echo "::error::package.json is still missing."
            exit 1
          }

          echo "Project root:"
          pwd
          ls -la

      - name: Install Node dependencies
        shell: bash
        run: |
          set -euo pipefail

          if [ -f package-lock.json ] || [ -f npm-shrinkwrap.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Build web application
        shell: bash
        run: |
          set -euo pipefail
          npm run build

      - name: Check Capacitor configuration
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f capacitor.config.ts ] && \
             [ ! -f capacitor.config.json ] && \
             [ ! -f capacitor.config.js ]; then
            echo "::error::Capacitor configuration file not found."
            exit 1
          fi

          npx cap --version

      - name: Prepare Android platform
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -d android ]; then
            npx cap add android
          fi

          test -d android || {
            echo "::error::Android platform was not created."
            exit 1
          }

      - name: Sync Android
        shell: bash
        run: |
          set -euo pipefail
          npx cap sync android

      - name: Verify Android Gradle files
        shell: bash
        run: |
          set -euo pipefail

          test -f android/gradlew || {
            echo "::error::android/gradlew is missing."
            exit 1
          }

          chmod +x android/gradlew

          if [ ! -f android/app/build.gradle ] && \
             [ ! -f android/app/build.gradle.kts ]; then
            echo "::error::Android app Gradle file is missing."
            exit 1
          fi

      - name: Build Release AAB
        shell: bash
        run: |
          set -euo pipefail
          cd android
          ./gradlew --no-daemon bundleRelease

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: catch-the-star-glow-release-aab
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 14
