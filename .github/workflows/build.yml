name: Build Catch The Star Glow Android AAB

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build Android AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Check project files
        run: |
          set -euo pipefail

          if [ ! -f package.json ]; then
            echo "::error::package.json is missing from the repository root."
            exit 1
          fi

          echo "Project files:"
          ls -la

      - name: Install dependencies
        run: |
          set -euo pipefail

          if [ -f package-lock.json ]; then
            npm ci
          elif [ -f npm-shrinkwrap.json ]; then
            npm ci
          else
            echo "::warning::No npm lock file found. Installing dependencies with npm install."
            npm install
          fi

      - name: Build Next.js application
        run: |
          set -euo pipefail
          npm run build

      - name: Check Capacitor configuration
        run: |
          set -euo pipefail

          if [ ! -f capacitor.config.ts ] && \
             [ ! -f capacitor.config.json ] && \
             [ ! -f capacitor.config.js ]; then
            echo "::error::Capacitor configuration file not found."
            exit 1
          fi

          npx cap --version

      - name: Add Android platform if missing
        run: |
          set -euo pipefail

          if [ ! -d android ]; then
            npx cap add android
          fi

          if [ ! -d android ]; then
            echo "::error::Android platform was not created."
            exit 1
          fi

      - name: Sync Capacitor Android
        run: |
          set -euo pipefail
          npx cap sync android

      - name: Validate Android project
        run: |
          set -euo pipefail

          test -f android/gradlew || {
            echo "::error::android/gradlew is missing."
            exit 1
          }

          chmod +x android/gradlew

          if [ ! -f android/app/build.gradle ] && \
             [ ! -f android/app/build.gradle.kts ]; then
            echo "::error::Android app Gradle file is missing."
            exit 1
          fi

      - name: Build Release AAB
        run: |
          set -euo pipefail
          cd android
          ./gradlew --no-daemon bundleRelease

      - name: Upload Android AAB
        uses: actions/upload-artifact@v4
        with:
          name: catch-the-star-glow-release-aab
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 14
