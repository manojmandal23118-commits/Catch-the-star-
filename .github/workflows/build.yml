name: Catch The Star Glow - Android AAB API 36

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Dependencies
        run: npm ci

      - name: Build Web App
        run: npm run build

      - name: Setup Android Platform
        run: |
          npx cap add android
          npx cap sync android

      - name: Configure Android API 36
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("android/variables.gradle")
          if p.exists():
              s = p.read_text()
              import re
              s = re.sub(
                  r"cdvCompileSdkVersion\s*=\s*\d+",
                  "cdvCompileSdkVersion = 36", s
              )
              s = re.sub(
                  r"cdvTargetSdkVersion\s*=\s*\d+",
                  "cdvTargetSdkVersion = 36", s
              )
              p.write_text(s)

          p = Path("android/app/build.gradle")
          s = p.read_text()
          import re

          s = re.sub(
              r"compileSdkVersion\s+\d+",
              "compileSdkVersion 36", s
          )
          s = re.sub(
              r"targetSdkVersion\s+\d+",
              "targetSdkVersion 36", s
          )
          p.write_text(s)
          PY

      - name: Install Android SDK 36
        run: |
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses
          "$SDKMANAGER" "platforms;android-36"
          "$SDKMANAGER" "build-tools;36.0.0"

      - name: Build Release AAB
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon bundleRelease

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: catch-the-star-glow-aab
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 14
