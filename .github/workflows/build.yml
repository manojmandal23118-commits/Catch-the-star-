name: Catch The Star Glow - Android AAB

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build Android AAB
    runs-on: ubuntu-latest

    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Locate game ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE=""

          for file in \
            "catch-the-star-glow-API36-GitHub-AAB.zip" \
            "catch the star glow GitHub AAB.zip" \
            "catch the star glow.zip"
          do
            if [ -f "$file" ]; then
              ZIP_FILE="$file"
              break
            fi
          done

          if [ -z "$ZIP_FILE" ]; then
            ZIP_FILE="$(find . -maxdepth 3 -type f \
              -iname '*catch*star*glow*.zip' \
              -not -path '*/.git/*' \
              | head -n 1 || true)"
          fi

          if [ -z "$ZIP_FILE" ]; then
            echo "::error::Game ZIP not found in the repository."
            exit 1
          fi

          echo "Selected ZIP: $ZIP_FILE"

          mkdir -p "$RUNNER_TEMP/catch-star-project"

          unzip -q "$ZIP_FILE" \
            -d "$RUNNER_TEMP/catch-star-project"

          PROJECT_DIR="$RUNNER_TEMP/catch-star-project"

          PACKAGE_FILE="$(find "$PROJECT_DIR" \
            -type f \
            -name package.json \
            -not -path '*/node_modules/*' \
            | head -n 1 || true)"

          if [ -z "$PACKAGE_FILE" ]; then
            echo "::error::package.json not found inside the game ZIP."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$PACKAGE_FILE")"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Game project located successfully."

      - name: Validate project configuration
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          node -e "
            const p = require('./package.json');
            if (!p.scripts || !p.scripts.build) {
              console.error('The build script is missing from package.json.');
              process.exit(1);
            }
          "

          echo "Project build configuration found."

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          npm install --no-audit --no-fund

      - name: Check Capacitor configuration
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          node - <<'NODE'
          const p = require('./package.json');
          const deps = {
            ...(p.dependencies || {}),
            ...(p.devDependencies || {})
          };

          if (!deps['@capacitor/core'] ||
              !deps['@capacitor/android']) {
            console.error(
              'Capacitor Android dependencies are missing.'
            );
            process.exit(1);
          }
          NODE

          if [ ! -f capacitor.config.ts ] &&
             [ ! -f capacitor.config.json ] &&
             [ ! -f capacitor.config.js ]; then
            echo "::error::Capacitor configuration is missing."
            exit 1
          fi

          echo "Capacitor configuration verified."

      - name: Build web application
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          npm run build

      - name: Synchronize Android project
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          npx cap sync android

          if [ ! -f android/gradlew ]; then
            echo "::error::Android Gradle wrapper is missing."
            exit 1
          fi

      - name: Configure Android API 36
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          python3 - <<'PY'
          from pathlib import Path
          import re

          variables = Path("android/variables.gradle")

          if variables.exists():
              text = variables.read_text(encoding="utf-8")

              text = re.sub(
                  r"(compileSdkVersion\s*=\s*)\d+",
                  r"\g<1>36",
                  text
              )

              text = re.sub(
                  r"(targetSdkVersion\s*=\s*)\d+",
                  r"\g<1>36",
                  text
              )

              variables.write_text(text, encoding="utf-8")

          gradle = Path("android/app/build.gradle")

          if gradle.exists():
              text = gradle.read_text(encoding="utf-8")

              text = re.sub(
                  r"\bcompileSdk\s+\d+",
                  "compileSdk 36",
                  text
              )

              text = re.sub(
                  r"\btargetSdk\s+\d+",
                  "targetSdk 36",
                  text
              )

              gradle.write_text(text, encoding="utf-8")

          print("API 36 configuration checked.")
          PY

      - name: Validate and decode signing key
        shell: bash
        run: |
          set -euo pipefail

          : "${ANDROID_KEYSTORE_BASE64:?Secret KEYSTORE_BASE64 is missing or empty}"
          : "${ANDROID_KEYSTORE_PASSWORD:?Secret KEYSTORE_PASSWORD is missing or empty}"
          : "${ANDROID_KEY_ALIAS:?Secret KEY_ALIAS is missing or empty}"
          : "${ANDROID_KEY_PASSWORD:?Secret KEY_PASSWORD is missing or empty}"

          KEYSTORE="$RUNNER_TEMP/catch-star-upload.jks"

          printf '%s' "$ANDROID_KEYSTORE_BASE64" |
            base64 --decode > "$KEYSTORE"

          if [ ! -s "$KEYSTORE" ]; then
            echo "::error::Decoded keystore file is empty."
            exit 1
          fi

          keytool -list \
            -keystore "$KEYSTORE" \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            >/dev/null

          echo "ANDROID_KEYSTORE_FILE=$KEYSTORE" >> "$GITHUB_ENV"

          echo "Signing key validated."

      - name: Configure release signing
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          python3 - <<'PY'
          from pathlib import Path
          import re

          gradle = Path("android/app/build.gradle")

          if not gradle.exists():
              raise SystemExit(
                  "Groovy build.gradle not found. "
                  "Kotlin DSL projects need a different signing patch."
              )

          text = gradle.read_text(encoding="utf-8")

          if "signingConfigs {" not in text:
              signing = """
              signingConfigs {
                  release {
                      storeFile file(System.getenv('ANDROID_KEYSTORE_FILE'))
                      storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
                      keyAlias System.getenv('ANDROID_KEY_ALIAS')
                      keyPassword System.getenv('ANDROID_KEY_PASSWORD')
                  }
              }
          """

              text, count = re.subn(
                  r"\bandroid\s*\{",
                  lambda m: m.group(0) + "\n" + signing,
                  text,
                  count=1
              )

              if count == 0:
                  raise SystemExit(
                      "Could not find the Android Gradle configuration."
                  )

          if "signingConfig signingConfigs.release" not in text:
              text, count = re.subn(
                  r"(buildTypes\s*\{\s*release\s*\{)",
                  r"\1\n            signingConfig signingConfigs.release",
                  text,
                  count=1
              )

              if count == 0:
                  raise SystemExit(
                      "Could not find the release build configuration."
                  )

          gradle.write_text(text, encoding="utf-8")

          print("Release signing configured.")
          PY

      - name: Build signed Release AAB
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR/android"

          chmod +x gradlew

          ./gradlew --no-daemon bundleRelease

      - name: Find and prepare AAB
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          AAB_FILE="$(find android \
            -type f \
            -path '*/outputs/bundle/release/*.aab' \
            | head -n 1 || true)"

          if [ -z "$AAB_FILE" ]; then
            echo "::error::AAB output was not found."
            exit 1
          fi

          mkdir -p "$RUNNER_TEMP/catch-star-output"

          cp "$AAB_FILE" \
            "$RUNNER_TEMP/catch-star-output/Catch-The-Star-Glow.aab"

          echo "AAB prepared successfully."

      - name: Upload Android AAB
        uses: actions/upload-artifact@v4
        with:
          name: Catch-The-Star-Glow-Android-AAB
          path: ${{ runner.temp }}/catch-star-output/Catch-The-Star-Glow.aab
          if-no-files-found: error
          retention-days: 14
