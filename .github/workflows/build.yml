name: Build Catch The Star Glow Android AAB

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build Android App Bundle
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Find and extract project ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="./CATCH-THE-STAR-GLOW-LOGO-FIX-ROOT-CAUSE.zip"

          if [ -f package.json ]; then
            echo "Project already exists in repository root."
          else
            if [ ! -f "$ZIP_FILE" ]; then
              echo "::error::Required project ZIP not found: $ZIP_FILE"
              echo "Upload the exact ZIP file to the repository root."
              exit 1
            fi

            mkdir -p /tmp/catch-star-project
            unzip -oq "$ZIP_FILE" -d /tmp/catch-star-project

            PACKAGE_FILE="$(find /tmp/catch-star-project \
              -type f -name package.json -print -quit)"

            if [ -z "$PACKAGE_FILE" ]; then
              echo "::error::No package.json found inside the ZIP."
              exit 1
            fi

            PROJECT_DIR="$(dirname "$PACKAGE_FILE")"
            cp -a "$PROJECT_DIR/." "$GITHUB_WORKSPACE/"
          fi

          test -f package.json || {
            echo "::error::package.json is missing."
            exit 1
          }

          echo "Project root:"
          pwd
          ls -la

      - name: Install Node dependencies
        shell: bash
        run: |
          set -euo pipefail

          if [ -f package-lock.json ] || [ -f npm-shrinkwrap.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Build web application
        shell: bash
        run: |
          set -euo pipefail
          npm run build

      - name: Check Capacitor configuration
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f capacitor.config.ts ] && \
             [ ! -f capacitor.config.json ] && \
             [ ! -f capacitor.config.js ]; then
            echo "::error::Capacitor configuration file not found."
            exit 1
          fi

          npx cap --version

      - name: Prepare Android platform
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -d android ]; then
            npx cap add android
          fi

          test -d android || {
            echo "::error::Android platform was not created."
            exit 1
          }

      - name: Sync Android
        shell: bash
        run: |
          set -euo pipefail
          npx cap sync android

      - name: Apply custom launcher icons
        shell: bash
        run: |
          set -euo pipefail

          ICON_SOURCE="$GITHUB_WORKSPACE/android-icon-assets"
          ANDROID_RES="$GITHUB_WORKSPACE/android/app/src/main/res"

          if [ ! -d "$ICON_SOURCE" ]; then
            echo "::error::android-icon-assets folder was not found."
            echo "The ZIP must contain the prepared launcher icon resources."
            exit 1
          fi

          # Copy custom icon resources after Capacitor sync.
          cp -a "$ICON_SOURCE/." "$ANDROID_RES/"

          # Verify standard launcher icon resources.
          for density in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            test -f "$ANDROID_RES/mipmap-$density/ic_launcher.png" || {
              echo "::error::Missing ic_launcher.png for $density."
              exit 1
            }
          done

          # Verify adaptive launcher icon configuration.
          test -f "$ANDROID_RES/mipmap-anydpi-v26/ic_launcher.xml" || {
            echo "::error::Adaptive launcher icon XML is missing."
            exit 1
          }

          # Verify Android manifest uses the launcher icon.
          MANIFEST="android/app/src/main/AndroidManifest.xml"

          test -f "$MANIFEST" || {
            echo "::error::AndroidManifest.xml is missing."
            exit 1
          }

          if ! grep -Eq 'android:icon="@mipmap/ic_launcher"' "$MANIFEST"; then
            echo "::error::Manifest does not reference @mipmap/ic_launcher."
            grep -n 'android:icon' "$MANIFEST" || true
            exit 1
          fi

          echo "Custom launcher icon resources verified."

      - name: Verify Android Gradle files
        shell: bash
        run: |
          set -euo pipefail

          test -f android/gradlew || {
            echo "::error::android/gradlew is missing."
            exit 1
          }

          chmod +x android/gradlew

          if [ ! -f android/app/build.gradle ] && \
             [ ! -f android/app/build.gradle.kts ]; then
            echo "::error::Android app Gradle file is missing."
            exit 1
          fi

      - name: Build Release AAB
        shell: bash
        run: |
          set -euo pipefail
          cd android
          ./gradlew --no-daemon bundleRelease

      - name: Verify AAB output
        shell: bash
        run: |
          set -euo pipefail

          AAB_FILE="android/app/build/outputs/bundle/release/app-release.aab"

          if [ ! -f "$AAB_FILE" ]; then
            echo "::error::Release AAB was not generated."
            find android/app/build/outputs -type f -name '*.aab' || true
            exit 1
          fi

          echo "Release AAB successfully generated:"
          ls -lh "$AAB_FILE"

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: catch-the-star-glow-release-aab
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 14
